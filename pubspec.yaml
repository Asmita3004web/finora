name: finora
description: A personal finance tracker with AI predictions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.3.0
  http: ^1.2.2
  
  # Navigation
  go_router: ^13.0.0
  
  # State management
  provider: ^6.1.2
  
  # Charts
  fl_chart: ^0.68.0
  
  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  
  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  csv: ^6.0.0

  # Image capture for the OCR Receipt Scanner (camera/gallery picker)
  image_picker: ^1.1.2

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
